global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "mysql"
    metrics_path: /probe
    static_configs:
      - targets:
          - mysql1:3306
        labels:
          auth_module: client.mysql1
      - targets:
          - mysql2:3306
        labels:
          auth_module: client.mysql2
      - targets:
          - mysql3:3306
        labels:
          auth_module: client.mysql3

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [auth_module]
        target_label: __param_auth_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: mysqld-exporter:9104

  - job_name: 'redis'
    static_configs:
      - targets:
        - redis://redis1-rt:6379
        - redis://redis2-rt:6379
        - redis://redis3-rt:6379
    metrics_path: /scrape
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: redis-exporter:9121
