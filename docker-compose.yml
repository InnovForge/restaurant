services:
  backend1:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: backend1
    restart: always
    ports:
      - "3001:3000"
    depends_on:
      - mysql-router
    environment:
      - PORT=3000
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - HOST_NAME=backend1
    env_file: 
      - path: .env
        required: true
    networks:
      - app-net

  backend2:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: backend2
    restart: always
    depends_on:
      - mysql-router
    ports:
      - "3002:3000"
    environment:
      - PORT=3000
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - HOST_NAME=backend2
    env_file: 
      - path: .env
        required: true
    networks:
      - app-net

  frontend1:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    environment:
      - VITE_APP_API_URL=${VITE_APP_API_URL}
    command: ["sh", "-c", "serve -s dist -l 5173"]
    container_name: frontend1
    depends_on:
      - mysql-router
    restart: always 
    ports:
      - "5173:5173"
    networks:
      - app-net

  frontend2:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    environment:
      - VITE_APP_API_URL=http://localhost:90/api/
    command: ["sh", "-c", "serve -s dist -l 5173"]
    container_name: frontend2
    restart: always 
    depends_on:
      - mysql-router
    ports:
      - "5174:5173"
    networks:
      - app-net

  mysql1:
    image: mysql/mysql-server:8.0
    container_name: mysql1
    restart: always
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_HOST=%
      - TZ=UTC
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --binlog-checksum=NONE
      --log-slave-updates=ON
      --read-only=OFF
      --plugin-load-add=mysql_clone.so
      --local-infile=1
    ports:
      - "3307:3306"
    volumes:
      - mysql1_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file: 
      - path: .env
        required: true
    networks:
      - app-net

  mysql2:
    image: mysql/mysql-server:8.0
    container_name: mysql2
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_HOST=%
      - TZ=UTC
    command: >
      --server-id=2
      --log-bin=mysql-bin
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --binlog-checksum=NONE
      --log-slave-updates=ON
      --read-only=OFF
      --plugin-load-add=mysql_clone.so
    ports:
      - "3308:3306"
    volumes:
      - mysql2_data:/var/lib/mysql
    env_file: 
      - path: .env
        required: true
    networks:
      - app-net

  mysql3:
    image: mysql/mysql-server:8.0
    container_name: mysql3
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_HOST=%
      - TZ=UTC
    command: >
      --server-id=3
      --log-bin=mysql-bin
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --binlog-checksum=NONE
      --log-slave-updates=ON
      --read-only=OFF
      --plugin-load-add=mysql_clone.so
    ports:
      - "3309:3306"
    volumes:
      - mysql3_data:/var/lib/mysql
    env_file: 
      - path: .env
        required: true
    networks:
      - app-net

  mysql-router:
    image: mysql/mysql-router:8.0
    container_name: mysql-router
    restart: always
    environment:
      - MYSQL_HOST=mysql1
      - MYSQL_PORT=3306
      - MYSQL_USER=replicator
      - MYSQL_PASSWORD=cdio@team1
    depends_on:
      - mysql1
    ports:
      - "6446:6446" # read/write endpoint
      - "6447:6447" # read-only endpoint
      - "8443:8443"
    networks:
      - app-net

  mysql-shell:
    build:
      context: ./mysql-shell
      dockerfile: Dockerfile
    container_name: mysql-shell
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql1:
        condition: service_healthy
      mysql2:
        condition: service_healthy
      mysql3:
        condition: service_healthy 
    volumes:
      - ./init-cluster.js:/init-cluster.js
    entrypoint: ["mysqlsh", "--js", "-f", "/init-cluster.js", "--no-wizard"]
    networks:
      - app-net

  s3:
    image: minio/minio
    container_name: minio-rt
    restart: always
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}" # Console Port
    volumes:
      - minio_volume:/data
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}" 
    env_file:
      - path: .env
        required: true
    networks:
      - app-net

  redis1-rt:
    image: redis:7.4.2-alpine
    container_name: redis1-rt
    restart: always
    ports:
      - "6381:6379"
    volumes:
      - redis_volume1:/data
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--protected-mode",
        "no",
        "--bind",
        "0.0.0.0"
      ]
    env_file:
      - path: .env
        required: true 
    networks:
      redis-net:
       ipv4_address: 172.50.0.2

  redis2-rt:
    image: redis:7.4.2-alpine
    container_name: redis2-rt
    restart: always
    ports:
      - "6382:6379"
    volumes:
      - redis_volume2:/data
    command:
     [
      "redis-server",
      "--appendonly", "yes",
      "--slaveof", "redis1-rt", "6379",
      "--bind", "0.0.0.0",
     ] 
    env_file:
      - path: .env
        required: true 
    networks:
      redis-net:
       ipv4_address: 172.50.0.3

  redis3-rt:
    image: redis:7.4.2-alpine
    container_name: redis3-rt
    restart: always
    ports:
      - "6383:6379" 
    command:
     [
      "redis-server",
      "--appendonly", "yes",
      "--slaveof", "redis1-rt", "6379",
      "--bind", "0.0.0.0",
     ]
    volumes:
      - redis_volume3:/data
    env_file:
      - path: .env
        required: true 
    networks:
      redis-net:
       ipv4_address: 172.50.0.4

  redis-sentinel1:
    image: redis:7.4.2-alpine
    container_name: redis-sentinel1
    restart: always

    command: >
      sh -c 'cp /sentinel.conf /etc/sentinel.conf && redis-sentinel /etc/sentinel.conf'
    volumes:
      - ./redis/sentinel2/sentinel.conf:/sentinel.conf
    # command: >
    #   sh -c 'echo "bind 0.0.0.0" > /etc/sentinel.conf &&
    #      echo "port 26379" >> /etc/sentinel.conf &&
    #      echo "sentinel monitor mymaster redis1-rt 6379 2" >> /etc/sentinel.conf &&
    #      echo "sentinel resolve-hostnames yes" >> /etc/sentinel.conf &&
    #      echo "sentinel down-after-milliseconds mymaster 5000" >> /etc/sentinel.conf &&
    #      echo "sentinel failover-timeout mymaster 10000" >> /etc/sentinel.conf &&
    #      echo "sentinel parallel-syncs mymaster 1" >> /etc/sentinel.conf &&
    #      redis-sentinel /etc/sentinel.conf'
    ports:
      - "26381:26379"
  
    depends_on:
      - redis1-rt
      - redis2-rt
      - redis3-rt
    networks:
      redis-net:
       ipv4_address: 172.50.0.5

  redis-sentinel2:
    image: redis:7.4.2-alpine
    container_name: redis-sentinel2
    restart: always
  
    command: >
      sh -c 'cp /sentinel.conf /etc/sentinel.conf && redis-sentinel /etc/sentinel.conf'
    volumes:
      - ./redis/sentinel2/sentinel.conf:/sentinel.conf
    # command: >
    #   sh -c 'echo "bind 0.0.0.0" > /etc/sentinel.conf &&
    #      echo "port 26379" >> /etc/sentinel.conf &&
    #      echo "sentinel monitor mymaster redis1-rt 6379 2" >> /etc/sentinel.conf &&
    #      echo "sentinel resolve-hostnames yes" >> /etc/sentinel.conf &&
    #      echo "sentinel down-after-milliseconds mymaster 5000" >> /etc/sentinel.conf &&
    #      echo "sentinel failover-timeout mymaster 10000" >> /etc/sentinel.conf &&
    #      echo "sentinel parallel-syncs mymaster 1" >> /etc/sentinel.conf &&
    #      redis-sentinel /etc/sentinel.conf'
    ports:
      - "26382:26379"
    depends_on:
      - redis1-rt
      - redis2-rt
      - redis3-rt
    networks:
      redis-net:
       ipv4_address: 172.50.0.6


  redis-sentinel3:
    image: redis:7.4.2-alpine
    container_name: redis-sentinel3
    restart: always

    command: >
      sh -c 'cp /sentinel.conf /etc/sentinel.conf && redis-sentinel /etc/sentinel.conf'
    volumes:
      - ./redis/sentinel3/sentinel.conf:/sentinel.conf
    # command: >
    #   sh -c 'echo "bind 0.0.0.0" > /etc/sentinel.conf &&
    #      echo "port 26379" >> /etc/sentinel.conf &&
    #      echo "sentinel monitor mymaster redis1-rt 6379 2" >> /etc/sentinel.conf &&
    #      echo "sentinel resolve-hostnames yes" >> /etc/sentinel.conf &&
    #      echo "sentinel down-after-milliseconds mymaster 5000" >> /etc/sentinel.conf &&
    #      echo "sentinel failover-timeout mymaster 10000" >> /etc/sentinel.conf &&
    #      echo "sentinel parallel-syncs mymaster 1" >> /etc/sentinel.conf &&
    #      redis-sentinel /etc/sentinel.conf'
    ports:
      - "26383:26379"
    depends_on:
      - redis1-rt
      - redis2-rt
      - redis3-rt
    networks:
      redis-net:
       ipv4_address: 172.50.0.7

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    networks:
      - app-net

  redis-haproxy:
    image: haproxy:3.1.8-alpine
    container_name: redis-haproxy
    restart: always
    ports:
      - "63790:6379"   
      - "8404:8404"
    volumes:
     - ./redis/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
    depends_on:
     - redis1-rt
     - redis2-rt
     - redis3-rt
    networks:
      redis-net:
       ipv4_address: 172.50.0.8
      app-net:

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "90:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-net

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysqld-exporter
    restart: always
    command:
     - "--config.my-cnf=/etc/mysql/exporter.cnf"
     - "--collect.global_status"
     - "--collect.info_schema.innodb_metrics"
     - "--collect.auto_increment.columns"
    volumes:
     - ./exporter.cnf:/etc/mysql/exporter.cnf:ro
    ports:
     - "9104:9104"
    networks:
     - app-net  

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis_exporter
    command:
     - "--redis.addr="
    ports:
     - "9121:9121"
    networks:
      redis-net:
       ipv4_address: 172.50.0.9
      app-net:
   
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    depends_on:
      - mysql-router
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - app-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"  
    depends_on:
      - prometheus
    volumes:
    - grafana_data:/var/lib/grafana
    - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - app-net

  # alloy:
  #   image: grafana/alloy:latest
  #   container_name: alloy
  #   volumes:
  #     - ./alloy-config.alloy:/etc/alloy/config.alloy
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   command: run --config.file=/etc/alloy/config.alloy
  #   depends_on:
  #     - backend1
  #     - backend2
  #     - loki
  #   networks:
  #     - app-net
  #

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - app-net

  k6:
    image: grafana/k6:latest
    volumes:
      - ./tests:/scripts
    working_dir: /scripts
    entrypoint: [ "k6" ]
    depends_on:
      - nginx

 

volumes:
  mysql1_data:
  mysql2_data:
  mysql3_data:
  minio_volume:
  redis_volume1:
  redis_volume2:
  redis_volume3:
  grafana_data:
 
networks:
  app-net:
    driver: bridge
  redis-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.50.0.0/24


