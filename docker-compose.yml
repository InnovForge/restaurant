services:
  backend1:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: backend1
    restart: always
    ports:
      - "3001:3000"
    depends_on:
      - mysql-router
    environment:
      - PORT=3000
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
    env_file: 
      - path: .env
        required: true
    networks:
      - app-net

  backend2:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: backend2
    restart: always
    depends_on:
      - mysql-router
    ports:
      - "3002:3000"
    environment:
      - PORT=3000
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
    env_file: 
      - path: .env
        required: true
    networks:
      - app-net

  frontend1:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    environment:
      - VITE_APP_API_URL=${VITE_APP_API_URL}
    command: ["sh", "-c", "serve -s dist -l 5173"]
    container_name: frontend1
    depends_on:
      - mysql-router
    restart: always 
    ports:
      - "5173:5173"
    networks:
      - app-net

  frontend2:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    environment:
      - VITE_APP_API_URL=http://localhost:90/api/
    command: ["sh", "-c", "serve -s dist -l 5173"]
    container_name: frontend2
    restart: always 
    depends_on:
      - mysql-router
    ports:
      - "5174:5173"
    networks:
      - app-net

  mysql1:
    image: mysql/mysql-server:8.0
    container_name: mysql1
    restart: always
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_HOST=%
      - TZ=UTC
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --binlog-checksum=NONE
      --log-slave-updates=ON
      --read-only=OFF
      --plugin-load-add=mysql_clone.so
    ports:
      - "3307:3306"
    volumes:
      - mysql1_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file: 
      - path: .env
        required: true
    networks:
      - app-net

  mysql2:
    image: mysql/mysql-server:8.0
    container_name: mysql2
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_HOST=%
      - TZ=UTC
    command: >
      --server-id=2
      --log-bin=mysql-bin
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --binlog-checksum=NONE
      --log-slave-updates=ON
      --read-only=OFF
      --plugin-load-add=mysql_clone.so
    ports:
      - "3308:3306"
    volumes:
      - mysql2_data:/var/lib/mysql
    env_file: 
      - path: .env
        required: true
    networks:
      - app-net

  mysql3:
    image: mysql/mysql-server:8.0
    container_name: mysql3
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_HOST=%
      - TZ=UTC
    command: >
      --server-id=3
      --log-bin=mysql-bin
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --binlog-checksum=NONE
      --log-slave-updates=ON
      --read-only=OFF
      --plugin-load-add=mysql_clone.so
    ports:
      - "3309:3306"
    volumes:
      - mysql3_data:/var/lib/mysql
    env_file: 
      - path: .env
        required: true
    networks:
      - app-net

  mysql-router:
    image: mysql/mysql-router:8.0
    container_name: mysql-router
    restart: always
    environment:
      - MYSQL_HOST=mysql1
      - MYSQL_PORT=3306
      - MYSQL_USER=replicator
      - MYSQL_PASSWORD=cdio@team1
    depends_on:
      - mysql1
    ports:
      - "6446:6446" # read/write endpoint
      - "6447:6447" # read-only endpoint
      - "8443:8443"
    networks:
      - app-net

  mysql-shell:
    build:
      context: ./mysql-shell
      dockerfile: Dockerfile
    container_name: mysql-shell
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql1:
        condition: service_healthy
      mysql2:
        condition: service_healthy
      mysql3:
        condition: service_healthy 
    volumes:
      - ./init-cluster.js:/init-cluster.js
    entrypoint: ["mysqlsh", "--js", "-f", "/init-cluster.js", "--no-wizard"]
    networks:
      - app-net

  s3:
    image: minio/minio
    container_name: minio-rt
    restart: always
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}" # Console Port
    volumes:
      - minio_volume:/data
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}" 
    env_file:
      - path: .env
        required: true
    networks:
      - app-net

  redis1-rt:
    image: redis:7.4.2-alpine
    container_name: redis1-rt
    restart: always
    ports:
      - "6381:6379"
    volumes:
      - redis_volume1:/data
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--protected-mode",
        "no"
      ]
    env_file:
      - path: .env
        required: true 
    networks:
      - app-net

  redis2-rt:
    image: redis:7.4.2-alpine
    container_name: redis2-rt
    restart: always
    ports:
      - "6382:6379"
    volumes:
      - redis_volume2:/data
    command:
      [
        "redis-server",
        "--appendonly", "yes",
        "--replicaof", "redis1-rt", "6379",
        "--repl-diskless-load", "on-empty-db",
        "--replica-announce-ip", "redis2-rt",
        "--replica-announce-port", "6379",
        "--protected-mode", "no"
      ]
    env_file:
      - path: .env
        required: true 
    networks:
      - app-net

  redis3-rt:
    image: redis:7.4.2-alpine
    container_name: redis3-rt
    restart: always
    ports:
      - "6383:6379"
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--replicaof",
        "redis1-rt",
        "6379",
        "--repl-diskless-load",
        "on-empty-db",
        "--replica-announce-ip",
        "redis3-rt",
        "--replica-announce-port",
        "6379",
        "--protected-mode",
        "no"
      ]
    volumes:
      - redis_volume3:/data
    env_file:
      - path: .env
        required: true 
    networks:
      - app-net

  redis-sentinel1:
    image: redis:7.4.2-alpine
    container_name: redis-sentinel1
    restart: always
    volumes:
      - ./redis/sentinel1:/etc/redis
      - redis_s1:/data
    command: ["redis-sentinel", "/etc/redis/sentinel.conf"]
    ports:
      - "26381:26379"
    depends_on:
      - redis1-rt
      - redis2-rt
      - redis3-rt
    networks:
      - app-net

  redis-sentinel2:
    image: redis:7.4.2-alpine
    container_name: redis-sentinel2
    restart: always
    volumes:
      - ./redis/sentinel2:/etc/redis
      - redis_s2:/data
    command: ["redis-sentinel", "/etc/redis/sentinel.conf"]
    ports:
      - "26382:26379"
    depends_on:
      - redis1-rt
      - redis2-rt
      - redis3-rt
    networks:
      - app-net

  redis-sentinel3:
    image: redis:7.4.2-alpine
    container_name: redis-sentinel3
    restart: always
    volumes:
      - ./redis/sentinel3:/etc/redis
      - redis_s3:/data
    command: ["redis-sentinel", "/etc/redis/sentinel.conf"]
    ports:
      - "26383:26379"
    depends_on:
      - redis1-rt
      - redis2-rt
      - redis3-rt
    networks:
      - app-net

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    networks:
      - app-net

  redis-haproxy:
    image: haproxy:3.1.8-alpine
    container_name: redis-haproxy
    restart: always
    ports:
      - "63790:6379"   # HAProxy port cho client
      - "8404:8404"
    volumes:
     - ./redis/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
    depends_on:
     - redis1-rt
     - redis2-rt
     - redis3-rt
    networks:
      - app-net

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "90:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-net

volumes:
  mysql1_data:
  mysql2_data:
  mysql3_data:
  minio_volume:
  redis_volume1:
  redis_volume2:
  redis_volume3:
  redis_s1:
  redis_s2:
  redis_s3:

networks:
  app-net:
    driver: bridge

