services:

  backend1:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: backend1
    restart: always
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
    env_file: 
      - path: .env
        required: true

  backend2:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: backend2
    restart: always
    ports:
      - "3002:3000"
    environment:
      - PORT=3000
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
    env_file: 
      - path: .env
        required: true

  frontend1:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    environment:
      - VITE_APP_API_URL=${VITE_APP_API_URL}
    command: ["sh", "-c", "serve -s dist -l 5173"]
    container_name: frontend1
    restart: always 
    ports:
      - "5173:5173" 

  frontend2:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    environment:
      - VITE_APP_API_URL=http://localhost:90/api/
    command: ["sh", "-c", "serve -s dist -l 5173"]
    container_name: frontend2
    restart: always 
    ports:
      - "5174:5173"

  mysql1:
    image: mysql/mysql-server:8.0
    container_name: mysql1
    restart: always
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_HOST=%
      - TZ=UTC
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --binlog-checksum=NONE
      --log-slave-updates=ON
      --read-only=OFF
      --plugin-load-add=mysql_clone.so
    ports:
      - "3307:3306"
    depends_on:
      - mysql2
    volumes:
      - mysql1_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file: 
      - path: .env
        required: true

  mysql2:
    image: mysql/mysql-server:8.0
    container_name: mysql2
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_HOST=%
      - TZ=UTC
    command: >
      --server-id=2
      --log-bin=mysql-bin
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --binlog-checksum=NONE
      --log-slave-updates=ON
      --read-only=OFF
      --plugin-load-add=mysql_clone.so
    ports:
      - "3308:3306"
    volumes:
      - mysql2_data:/var/lib/mysql
    env_file: 
      - path: .env
        required: true

  mysql-router:
    image: mysql/mysql-router:8.0
    container_name: mysql-router
    restart: always
    environment:
      - MYSQL_HOST=mysql1
      - MYSQL_PORT=3306
      - MYSQL_USER=replicator
      - MYSQL_PASSWORD=cdio@team1
    depends_on:
      - mysql-shell
    ports:
      - "6446:6446" # read/write endpoint
      - "6447:6447" # read-only endpoint

  mysql-shell:
    build:
      context: ./mysql-shell
      dockerfile: Dockerfile
    container_name: mysql-shell
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql1:
        condition: service_healthy
      mysql2:
        condition: service_healthy
    volumes:
      - ./init-cluster.js:/init-cluster.js
    entrypoint: ["mysqlsh", "--js", "-f", "/init-cluster.js", "--no-wizard"]

  s3:
    image: minio/minio
    container_name: minio-rt
    restart: always
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}" # Console Port
    volumes:
      - minio_volume:/data
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}" 
    env_file:
      - path: .env
        required: true

  redis:
    image: redis:7.4.2-alpine
    container_name: redis-rt
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_volume:/data
    env_file:
      - path: .env
        required: true 


  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "90:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro


volumes:
  mysql1_data:
  mysql2_data:
  minio_volume:
  redis_volume:

